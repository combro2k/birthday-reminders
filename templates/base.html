<!DOCTYPE html>
<html lang="en" data-theme="{% block theme %}dark{% endblock %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <script>
        (function bootstrapTheme() {
            var root = document.documentElement;
            var theme = root.getAttribute('data-theme') || 'dark';
            var supportsMedia = typeof window.matchMedia === 'function';
            var prefersDark = supportsMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var resolved = theme === 'auto' ? (prefersDark ? 'dark' : 'light') : theme;

            root.classList.toggle('dark', resolved === 'dark');
            root.classList.toggle('light', resolved === 'light');
        })();
    </script>
    <title>{% block title %}Birthday Reminders{% endblock %}</title>
    <link rel="stylesheet" href="/static/tailwind.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0f766e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Birthdays">
    <link rel="apple-touch-icon" href="/static/icon-180.png">
    <script type="module" src="/static/main.js"></script>
    <script nomodule src="/static/main.legacy.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="selection:bg-teal-200 selection:text-slate-900 dark:selection:bg-teal-800 dark:selection:text-slate-100" {% block body_attributes %}{% endblock %}>
    {% block body %}{% endblock %}
    {% block footer %}{% endblock %}
</body>
</html>
