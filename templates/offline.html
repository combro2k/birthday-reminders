<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Offline - Birthday Reminders</title>
    <link rel="stylesheet" href="/static/tailwind.css">
</head>
<body class="min-h-screen bg-stone-100 text-slate-900">
    <main class="mx-auto flex min-h-screen w-full max-w-xl items-center px-6 py-10">
        <section class="w-full rounded-3xl border border-stone-200 bg-white/95 p-8 shadow-xl">
            <p class="mb-3 inline-block rounded-full bg-amber-100 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-amber-700">Offline mode</p>
            <h1 class="font-display text-3xl font-bold text-slate-900">No connection right now</h1>
            <p class="mt-3 text-slate-600">
                Birthday Reminders could not reach the server. Previously visited pages stay available while you are offline.
            </p>
            <div class="mt-6 flex flex-col gap-3 sm:flex-row">
                <button onclick="location.reload()" class="inline-flex min-h-11 items-center justify-center rounded-xl bg-brand-700 px-5 py-2 text-sm font-semibold text-white transition hover:bg-brand-800">
                    Try again
                </button>
                <a href="/" class="inline-flex min-h-11 items-center justify-center rounded-xl border border-stone-300 bg-stone-50 px-5 py-2 text-sm font-semibold text-slate-700 transition hover:bg-stone-100">
                    Back to dashboard
                </a>
            </div>
        </section>
    </main>
</body>
</html>
