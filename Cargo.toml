# Error handling
[package]
name = "birthday-reminders"
version = "1.1.11"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rust-embed = { version = "8.11", features = ["interpolate-folder-path", "compression"] }
mime_guess = "2.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "compression-full"] }

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "sqlite", "mysql", "chrono", "migrate", "uuid"] }

# Templates
askama = "0.16"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# CSV export
csv = "1"

# Scheduler
tokio-cron-scheduler = "0.15"

# HTTP Client (Gotify, Telegram)
reqwest = { version = "0.13.3", features = ["json", "form"] }

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "smtp-transport"] }

# OIDC
openidconnect = "4.0"

# MCP
rmcp = { version = "1.7.0", features = ["server", "macros", "schemars", "tower", "transport-streamable-http-server", "transport-streamable-http-server-session"] }

# Auth
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
chacha20poly1305 = "0.10"
base64 = "0.22"

# Sessions
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres", "sqlite", "mysql"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
syslog = "7"

# Utilities
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
ipnet = "2"
url = "2"

# Privilege dropping
nix = { version = "0.31", default-features = false, features = ["user"] }
unix_users = { package = "users", version = "0.11" }

[profile.dev]
# Reduce memory usage during compilation
codegen-units = 8

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
